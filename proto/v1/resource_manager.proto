syntax = "proto3";

package cornserve.resource_manager;

import "common.proto";

service ResourceManager {
  // Deploy a new unit task
  rpc DeployUnitTask(DeployUnitTaskRequest) returns (DeployUnitTaskResponse);

  // Tear down a unit task
  rpc TeardownUnitTask(TeardownUnitTaskRequest) returns (TeardownUnitTaskResponse);

  // Health checking
  rpc Healthcheck(HealthcheckRequest) returns (HealthcheckResponse);

  // Scale up a unit task
  rpc ScaleUnitTask(ScaleUnitTaskRequest) returns (ScaleUnitTaskResponse);

  // Sync task registry to a target resource version
  rpc SyncTaskRegistry(common.SyncTaskRegistryRequest) returns (common.SyncTaskRegistryResponse);

  // Get a snapshot of resource allocation status
  rpc GetResourceSnapshot(GetResourceSnapshotRequest) returns (GetResourceSnapshotResponse);

  // Apply a resource allocation snapshot
  rpc ApplyResourceSnapshot(ApplyResourceSnapshotRequest) returns (ApplyResourceSnapshotResponse);

  // Get list of deployed task managers
  rpc GetDeployedTaskManagers(GetDeployedTaskManagersRequest) returns (GetDeployedTaskManagersResponse);
}

// Deploy a new task
message DeployUnitTaskRequest {
  // Name of the UnitTaskInstance CR that contains the task definition
  string task_instance_name = 1;
}

message DeployUnitTaskResponse {
  // Success or failure
  common.Status status = 1;
}

// Tear down a task
message TeardownUnitTaskRequest {
  // Name of the UnitTaskInstance CR to tear down
  string task_instance_name = 1;
}

message TeardownUnitTaskResponse {
  // Success or failure
  common.Status status = 1;
}

// Health checking
message TaskManagerStatus {
  // Name of the UnitTaskInstance CR for this task manager
  string task_instance_name = 1;
  common.Status status = 2;
}

message HealthcheckRequest {}

message HealthcheckResponse {
  common.Status status = 1;
  repeated TaskManagerStatus task_manager_statuses = 2;
}

message ScaleUnitTaskRequest {
  // Name of the UnitTaskInstance CR to scale
  string task_instance_name = 1;
  // Number of GPUs to add or remove
  int32 num_gpus = 2;
}

message ScaleUnitTaskResponse {
  // Success or failure
  common.Status status = 1;
}

// Resource snapshot
message GPUStatus {
  string node = 1;
  int32 global_rank = 2;
  int32 local_rank = 3;
  // Owner task manager ID, empty string if free
  string owner = 4;
}

message NodeStatus {
  string node = 1;
  int32 total_gpus = 2;
  int32 free_gpus = 3;
  repeated GPUStatus gpus = 4;
}

message GetResourceSnapshotRequest {}

message GetResourceSnapshotResponse {
  common.Status status = 1;
  repeated NodeStatus nodes = 2;
}

message ApplyResourceSnapshotRequest {
  repeated NodeStatus nodes = 1;
}

message ApplyResourceSnapshotResponse {
  common.Status status = 1;
  string message = 2;
}

message DeployedTaskManager {
  string task_manager_id = 1;
  string task_instance_name = 2;
  int32 num_gpus = 3;
}

message GetDeployedTaskManagersRequest {}

message GetDeployedTaskManagersResponse {
  common.Status status = 1;
  repeated DeployedTaskManager task_managers = 2;
}

