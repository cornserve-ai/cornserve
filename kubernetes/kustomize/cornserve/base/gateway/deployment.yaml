# Gateway Master — single replica, handles all state-altering operations
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-master
  namespace: cornserve
  labels:
    app: gateway
    gateway-role: master
spec:
  selector:
    matchLabels:
      app: gateway
      gateway-role: master
  replicas: 1
  template:
    metadata:
      labels:
        app: gateway
        gateway-role: master
    spec:
      serviceAccountName: gateway-sa
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
      - name: gateway
        image: cornserve/gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: GATEWAY_ROLE
          value: "master"
        envFrom:
        - configMapRef:
            name: cornserve-config
