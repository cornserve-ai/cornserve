apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appinstances.cornserve.ai
spec:
  group: cornserve.ai
  scope: Namespaced
  names:
    plural: appinstances
    singular: appinstance
    kind: AppInstance
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                appId:
                  type: string
                sourceCode:
                  type: string
                taskKeys:
                  type: array
                  items:
                    type: string
                isStreaming:
                  type: boolean
                state:
                  type: string
              required: ["appId", "sourceCode", "taskKeys", "isStreaming", "state"]
